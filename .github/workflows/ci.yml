name: Continuous Integration

on:
    push:
        branches: ['**']
        tags: ['v*']
    # Safe to run untrusted fork PR code here: `pull_request` (never
    # `pull_request_target`) runs the PR's own workflow file with a
    # read-only GITHUB_TOKEN and no repository secrets, and `permissions`
    # below pins that down explicitly regardless of repo-level defaults.
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-app:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Go
              uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
              with:
                go-version: '1.26.2'

            - name: Lint
              uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
              with:
                version: 'v2.12.2'

            - name: Run unit tests
              run: go test ./...

            - name: Build binaries
              run: |
                mkdir -p dist
                platforms="linux/amd64 windows/amd64"
                for p in $platforms; do
                  export GOOS=${p%/*} GOARCH=${p#*/}
                  ext=""; [ "$GOOS" = "windows" ] && ext=".exe"
                  go build -o dist/zed-assistant-mcp-${GOOS}-${GOARCH}${ext} ./cmd/server/*.go
                done

            - name: Upload build artifacts
              # Artifacts are only needed by the release workflow, so only
              # produce them for tag pushes.
              if: startsWith(github.ref, 'refs/tags/')
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                name: binaries
                path: dist/*
                if-no-files-found: error
                retention-days: 7
